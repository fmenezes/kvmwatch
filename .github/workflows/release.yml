name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal binary
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Package
        run: |
          BIN_PATH="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)"
          "$BIN_PATH/kvmwatch" --version
          tar -czf "kvmwatch-${GITHUB_REF_NAME}-macos-universal.tar.gz" -C "$BIN_PATH" kvmwatch

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "kvmwatch-${GITHUB_REF_NAME}-macos-universal.tar.gz" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
